# OpenOCD 0.12+; works with ST-LINK/V2 over SWD.
source [find interface/stlink.cfg]
# OpenOCD 0.12 uses HLA; newer releases may use the direct ST-Link driver.
if {[adapter name] eq "hla"} {
    transport select hla_swd
} else {
    transport select swd
}
set CHIPNAME panda
set WORKAREASIZE 0x4000
source [find target/stm32f1x.cfg]
# Start conservatively for jumper-wire connections; increase after SWD works.
adapter speed 100
# The normal Blue Pill four-pin SWD connector does not carry NRST.
reset_config none
